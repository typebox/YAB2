<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>YAB | Living Documentation</title>
    <style>{{BUNDLED_FONTS_CSS}}</style>
    <style>{{PRISM_THEME_CSS}}</style>
    <style>{{APP_CSS}}</style>
</head>
<body>
    <div id="loading-overlay" style="position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1rem;">
        <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <span style="font-size:0.8rem;color:#64748b;font-weight:600;">Loading Database...</span>
    </div>
    <aside class='nav-pane'>
        <a href='#' class='logo'><svg width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg> YAB <span>BANKING</span></a>
        <div class='nav-section'>
            <h4>View Layout</h4>
            <div class="layout-selector">
                <button class="layout-btn" id="btn-layout-business" onclick="setLayout('business')">Business</button>
                <button class="layout-btn" id="btn-layout-both" onclick="setLayout('both')">Both</button>
                <button class="layout-btn" id="btn-layout-code" onclick="setLayout('code')">Code</button>
            </div>
        </div>
        <div class='nav-section'>
            <h4>Search</h4>
            <input type='text' id='search-input' placeholder='Search blocks...' class='search-input' oninput='debounceSearch(this.value)'>
            <div id='search-results' class='search-results'></div>
        </div>
        <div class='nav-section'><h4>Domain Concepts</h4><nav id='nav-concepts'></nav></div>
        <div class='nav-section'>
            <label style='display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;cursor:pointer;margin-top:1rem;color:var(--text-secondary);font-weight:600'>
                <input type='checkbox' id='toggle-anchors' onchange='document.body.classList.toggle("show-anchors",this.checked)'>
                <span>Show Physical Anchors</span>
            </label>
        </div>
        <button class='manual-audit-btn' onclick='openModal()'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><path d='M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z'/></svg> Paste AI Results</button>
        <div id='manual-modal' class='modal'><div class='modal-content'><h3>Paste AI Results</h3><p style='font-size:0.8rem;color:var(--text-secondary)'>Paste raw AI output containing 'COMPONENT: [Name] - [PASSED/BLOCKED]'.</p><textarea id='ai-results-input' placeholder='COMPONENT: MyClass - PASSED...'></textarea><div class='modal-actions'><button onclick='closeModal()' style='padding:0.5rem 1rem;border:none;background:none;cursor:pointer'>Cancel</button><button onclick='submitResults()' style='padding:0.5rem 1rem;background:var(--accent);color:white;border:none;border-radius:0.4rem;cursor:pointer'>Update Cache</button></div></div></div>
        <div class='commit-badge' id='commit-id'>Commit: </div>
    </aside>
    <main class='app-container'>
        <section class='content-pane' id='doc-content'></section>
        <section class='implementation-pane' id='impl-content'></section>
    </main>
    <div class='sidebar-toggle' onclick='toggleSidebar()' title='Toggle Sidebar'>
        <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M15 18l-6-6 6-6'/></svg>
    </div>
    <script>{{BUNDLED_VENDOR_JS}}</script>
    <script type="text/plain" id="yab-wasm-base64">{{SQLJS_WASM_BASE64}}</script>
    <script type="application/octet-stream" id="yab-sqlite-base64">{{SQLITE_BASE64}}</script>
    <script>{{APP_JS}}</script>
</body>
</html>
